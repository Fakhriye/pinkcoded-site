<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pink Coded — by girls for girls</title>
    <meta
      name="description"
      content="Pink Coded is a student-run community that gives girls free STEM courses, olympiad preparation and mentorship — coding, English, research and studying abroad."
    />
    <meta name="theme-color" content="#b4466b" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pinkcoded.net/" />
    <meta property="og:title" content="Pink Coded — by girls for girls" />
    <meta
      property="og:description"
      content="A community for girls who turn ideas into code and real projects. Marathons, bootcamps and mentorship from Kazakhstan and the CIS."
    />
    <meta property="og:image" content="https://pinkcoded.net/og-image.jpg" />

    <link rel="canonical" href="https://pinkcoded.net/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Quicksand:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tells Google who runs Pink Coded, so the site can show up for the founders' names -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Pink Coded",
        "url": "https://pinkcoded.net/",
        "logo": "https://pinkcoded.net/pinkcoded-logo.png",
        "email": "info@pinkcoded.net",
        "slogan": "by girls for girls",
        "description": "Student-run community that gives girls free STEM courses, olympiad preparation and mentorship.",
        "foundingLocation": { "@type": "Place", "name": "Almaty, Kazakhstan" },
        "sameAs": ["https://t.me/pinkcodeeed"],
        "founder": [
          { "@type": "Person", "name": "Fakhriye Kubysheva", "alternateName": "Fakhri Kubysheva", "jobTitle": "Co-Founder" },
          { "@type": "Person", "name": "Aisha Tortkara", "jobTitle": "Co-Founder" },
          { "@type": "Person", "name": "Natalie Khan", "jobTitle": "Co-Founder" },
          { "@type": "Person", "name": "Feride Akhmedova", "jobTitle": "Co-Founder" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
